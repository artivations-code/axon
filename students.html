<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IndiATA · For Students</title>
</head>
<body>

<!-- ==== PASTE FROM HERE ==== -->
<div class="iata-stu" id="iata-students">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Open+Sans:wght@700;800&display=swap');

.iata-stu{
  --navy:#02060E; --navy2:#061320;
  --off:#E9EEF2; --off-mut:#9FB0BC; --slate-lt:#8AA6B5;
  --magenta:#AE0055; --magenta-deep:#8A0044;
  --olive:#879637; --olive-deep:#5E6312;
  --line2:#2A3A47;
  --disp:'Open Sans',-apple-system,Segoe UI,sans-serif;
  --body:'Lato',-apple-system,Segoe UI,sans-serif;
  font-family:var(--body);background:var(--navy);color:var(--off);line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:clamp(2.5rem,7vw,5rem) clamp(1.15rem,5vw,3rem)
}
.iata-stu *{box-sizing:border-box;margin:0;padding:0}
.iata-stu .inner{max-width:600px;margin:0 auto}
.iata-stu .kicker{font-family:var(--disp);font-weight:800;text-transform:uppercase;color:var(--olive);
  line-height:.95;letter-spacing:.01em;font-size:clamp(2.4rem,1.3rem+6vw,4.5rem)}
.iata-stu .title{font-family:var(--disp);font-weight:800;text-transform:uppercase;color:var(--off);
  letter-spacing:.02em;font-size:clamp(1.3rem,1rem+2vw,2rem);margin:.4rem 0 1rem}
.iata-stu .intro{color:var(--off-mut);margin-bottom:2.4rem;font-size:clamp(1rem,.96rem+.3vw,1.15rem)}
.iata-stu form{display:grid;gap:1.4rem}
.iata-stu .fld{display:grid;gap:.5rem}
.iata-stu .fld label{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  font-size:.76rem;color:var(--slate-lt)}
.iata-stu .fld label .opt{color:var(--off-mut);font-weight:600;text-transform:none;letter-spacing:.04em;font-size:.92em}
.iata-stu .fld input,.iata-stu .fld select{width:100%;background:var(--navy2);border:1px solid var(--line2);
  border-radius:14px;color:var(--off);font-family:var(--body);font-size:1.05rem;padding:1rem 1.1rem}
.iata-stu .fld input::placeholder{color:var(--off-mut)}
.iata-stu .fld input:focus,.iata-stu .fld select:focus{outline:none;border-color:var(--olive)}
.iata-stu .fld select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:2.8rem;
  background-repeat:no-repeat;background-position:right 1.1rem center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239FB0BC' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>")}
.iata-stu .fld select:has(option[value=""]:checked){color:var(--off-mut)}
.iata-stu button{justify-self:start;margin-top:.3rem;display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;
  padding:.9rem 1.5rem;border-radius:999px;border:0;cursor:pointer;color:var(--off);background:var(--magenta)}
.iata-stu button:hover{background:var(--magenta-deep)}
.iata-stu .ok{display:none;margin-top:.4rem;padding:1rem 1.2rem;border:1px solid var(--olive-deep);
  border-radius:14px;background:rgba(135,150,55,.12);color:var(--off)}
.iata-stu .ok.show{display:block}
</style>

<div class="inner">
  <p class="kicker">For students</p>
  <h2 class="title">Stay in the loop</h2>
  <p class="intro">A monthly note for art therapy students across Indiana &mdash; events, deadlines, opportunities, and what&rsquo;s next for the field. One email a month. Leave any time.</p>

  <!-- To collect signups: set action="" to your form service and delete data-demo="1".
       Or swap this for a Squarespace Newsletter block. -->
  <form action="" method="post" data-demo="1">
    <div class="fld">
      <label for="su-name">First name</label>
      <input id="su-name" name="first_name" type="text" placeholder="Your name" autocomplete="given-name">
    </div>
    <div class="fld">
      <label for="su-email">Email</label>
      <input id="su-email" name="email" type="email" placeholder="you@school.edu" autocomplete="email" required>
    </div>
    <div class="fld">
      <label for="su-member">Membership</label>
      <select id="su-member" name="membership" required>
        <option value="" disabled selected>Select one</option>
        <option>IndiATA student member</option>
        <option>Not a member yet</option>
      </select>
    </div>
    <div class="fld">
      <label for="su-program">Program <span class="opt">(optional)</span></label>
      <select id="su-program" name="program">
        <option value="" disabled selected>Select your program</option>
        <option>Herron School of Art + Design (IU)</option>
        <option>Saint Mary-of-the-Woods College</option>
        <option>Other</option>
      </select>
    </div>
    <button type="submit">Sign me up &rarr;</button>
    <p class="ok" role="status" aria-live="polite">Thanks &mdash; you&rsquo;re on the list.</p>
  </form>
</div>

<script>
(function(){
  var root=document.getElementById('iata-students');
  var form=root&&root.querySelector('form');
  if(form&&form.getAttribute('data-demo')){
    form.addEventListener('submit',function(e){
      e.preventDefault();
      if(form.checkValidity&&!form.checkValidity()){form.reportValidity&&form.reportValidity();return;}
      var ok=form.querySelector('.ok');
      if(ok)ok.classList.add('show');
      form.querySelectorAll('input,select,button').forEach(function(el){el.disabled=true;});
    });
  }
})();
</script>
<!-- ==== PASTE TO HERE ==== -->

</body>
</html>
